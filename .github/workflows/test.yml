name: Smoke test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game script syntax
        run: node --check game.js
      - name: Run PixelFX rendering test
        run: node --test tests/*.test.js
