name: Publish Platformer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify handcrafted VFX
        run: node --check game.js && node tools/check.mjs custom
      - name: Generate visual-review contact sheets
        run: node tools/render.mjs custom --max 12 --zoom 2
      - name: Package static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
